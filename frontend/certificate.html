<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Certificate Verification | E-Cycle</title><link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar"><div class="container nav-content"><a href="index.html" class="logo">♻️ E-Cycle</a><div class="nav-links"><a href="index.html">Home</a><a href="track.html">Track</a></div></div></nav>
<main class="container"><div class="form-wrap"><span class="tag">PUBLIC VERIFICATION</span><h1>Certificate verification</h1><p>Verify an E-Cycle processing record using its certificate ID or secure verification token.</p><form onsubmit="verifyCertificate(event)"><div class="form-group"><label for="certificateToken">Certificate ID or verification token</label><input id="certificateToken" required></div><button class="btn btn-primary">Verify certificate</button></form><div id="certificateResult" class="result" aria-live="polite"></div></div></main>
<script src="js/script.js"></script><script>
async function verifyCertificate(event){event.preventDefault();const box=document.getElementById('certificateResult');box.classList.remove('show');try{const identifier=document.getElementById('certificateToken').value.trim();const r=await api('/certificates/'+encodeURIComponent(identifier));box.textContent='';box.append(make('h3',r.valid?'Valid E-Cycle processing record':'Revoked certificate'),make('p',`${r.certificate_no} · ${r.device_name} · ${r.quantity} item(s)`),make('p',`Tracking ID: ${r.tracking_id}`),make('p',`Facility: ${r.facility_name||'Recorded facility'}`),make('p',`Outcome: ${r.outcome||'Processed'} · ${prettyDate(r.processed_at||r.issued_at)}`));box.classList.add('show');}catch(e){box.textContent=e.message;box.classList.add('show');}}
document.addEventListener('DOMContentLoaded',()=>{const token=new URLSearchParams(location.search).get('token');if(token){document.getElementById('certificateToken').value=token;verifyCertificate({preventDefault(){}});}});
</script></body></html>
