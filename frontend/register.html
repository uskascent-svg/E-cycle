<section class="page-hero"><div class="container"><span class="tag">JOIN E-CYCLE</span><h1>Create Your Account</h1><p>Start managing your e-waste responsibly.</p></div></section>
<section class="section"><div class="container"><div class="form-wrap">
<form onsubmit="handleRegister(event)"><div class="form-row"><div class="form-group"><label>Name</label><input id="regName" required minlength="2" maxlength="100" placeholder="Your name"></div><div class="form-group"><label>Phone</label><input id="regPhone" required placeholder="9876543210"></div></div>
<div class="form-group"><label>Email</label><input id="regEmail" type="email" required placeholder="you@example.com"></div>
<div class="form-group"><label>Password</label><input id="regPassword" type="password" required minlength="8" maxlength="128" placeholder="At least 8 characters"></div>
<div class="form-group"><label>Address</label><textarea id="regAddress" required minlength="5" maxlength="500" placeholder="Pickup / contact address"></textarea></div>
<button class="btn btn-primary btn-large" type="submit">Create Account</button></form>
<p id="registerMessage" style="margin-top:15px"></p>
</div></div></section>
