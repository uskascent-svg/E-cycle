<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login | E-Cycle</title><link rel="stylesheet" href="/css/style.css"></head><body>
<main class="form-wrap" style="margin-top:90px"><span class="tag">SECURE ADMIN PORTAL</span><h1>Administrator sign in</h1><p>Authorized E-Cycle staff only. Access is enforced by the backend.</p><form onsubmit="adminLogin(event)"><div class="form-group"><label for="adminEmail">Email</label><input id="adminEmail" type="email" required autocomplete="username"></div><div class="form-group"><label for="adminPassword">Password</label><input id="adminPassword" type="password" required autocomplete="current-password"></div><button class="btn btn-primary" type="submit">Sign in</button><p id="adminLoginMessage" aria-live="polite"></p></form><p style="margin-top:20px"><a href="/">Return to E-Cycle</a></p></main><script src="/js/script.js"></script><script>
async function adminLogin(e){e.preventDefault();try{const r=await api('/auth/login',{method:'POST',body:{email:adminEmail.value,password:adminPassword.value}});if(!r.user||r.user.role!=='admin'){await api('/auth/logout',{method:'POST'});throw {message:'Admin access required'};}window.location.href='/admin/dashboard';}catch(x){showMessage(adminLoginMessage,x.message||'Unable to sign in');}}
</script></body></html>
