<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Report an Issue | E-Cycle</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="navbar"><div class="container nav-content"><a href="index.html" class="logo">♻️ E-Cycle</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="operations.html">Pickup</a></div><div class="nav-buttons"></div></div></nav><main class="container"><div class="form-wrap"><span class="tag">SAFETY REPORTING</span><h1>Report an issue</h1><p>Submit suspicious content for review. Do not include passwords or sensitive personal data.</p><form onsubmit="submitReport(event)"><div class="form-group"><label>Issue type</label><select id="issueType" required><option>Phishing website</option><option>Suspicious URL</option><option>Malicious email</option><option>Scam message</option><option>Malware</option><option>Credential theft</option><option>Impersonation</option><option>Suspicious attachment</option><option>Other</option></select></div><div class="form-group"><label>Title</label><input id="reportTitle" minlength="3" maxlength="150" required></div><div class="form-group"><label>Description</label><textarea id="reportDescription" minlength="10" maxlength="4000" required></textarea></div><div class="form-group"><label>Suspicious URL (optional)</label><input id="reportUrl" type="url" placeholder="https://example.com"></div><div class="form-row"><div class="form-group"><label>Severity</label><select id="reportSeverity"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>CRITICAL</option></select></div></div><button class="btn btn-primary">Submit report</button><p id="reportMessage" aria-live="polite"></p></form></div></main><script src="js/script.js"></script><script>async function submitReport(e){e.preventDefault();try{const r=await api('/reports',{method:'POST',body:{issue_type:issueType.value,title:reportTitle.value,description:reportDescription.value,suspicious_url:reportUrl.value,severity:reportSeverity.value}});showMessage(reportMessage,`Report ${r.report_id} submitted.`,`ok`);e.target.reset();}catch(x){showMessage(reportMessage,x.message);}}</script></body></html>
