<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Map | E-Cycle</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body>
<nav class="navbar"><div class="container nav-content"><a class="logo" href="index.html">♻️ E-Cycle</a><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="operations.html">Operations</a></div></div></nav>
<main class="container"><div class="page-hero"><span class="tag">OPERATIONAL LOCATIONS</span><h1>Collection map</h1><p id="mapPrivacy">Loading authorized locations…</p></div><section id="locationShare" class="panel" hidden><h3>Share a pickup location</h3><p>Share your device location only with your consent. It will remain hidden from the operational map until verified.</p><select id="locationSubmission" aria-label="Submission for location sharing"></select><button id="shareLocation" class="btn btn-primary" type="button">Share current location</button><p id="locationMessage" aria-live="polite"></p></section><div id="map" style="height:480px;border-radius:18px;margin:24px 0;background:#edf5ef"></div><section class="panel"><h3>Location list</h3><div id="mapList" class="guide-list"><p>Loading…</p></div></section></main>
<script src="js/script.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const mapBox=L.map('map').setView([20.5937,78.9629],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(mapBox);function renderMap(data){mapPrivacy.textContent=data.privacy_note||'Only authorized operational locations are displayed.';const markers=data.markers||[];if(!markers.length){const locations=data.locations||[];mapList.textContent='';if(locations.length){mapPrivacy.textContent+=' Coordinates are unavailable, so the latest operational locations are shown below.';locations.forEach(x=>{const item=make('div',undefined,'guide-item');item.append(make('strong',x.status||'Operational location'),make('p',`${x.location} · ${x.quantity} item(s) · ${x.tracking_id} · updated ${prettyDate(x.created_at)}`));mapList.append(item);});}else{const pending=data.pending_locations||0;mapList.append(make('p',pending?`No verified coordinates yet. ${pending} location submission(s) are awaiting review.`:'No verified consented coordinates are available. The map will remain empty rather than showing invented pins.'));}return;}const group=[];mapList.textContent='';markers.forEach(m=>{const marker=L.marker([m.latitude,m.longitude]).addTo(mapBox).bindPopup(`${m.entity_type} · updated ${prettyDate(m.updated_at)}`);group.push(marker);const item=make('div',undefined,'guide-item');item.append(make('strong',m.entity_type),make('p',`${m.tracking_id||'Operational location'} · updated ${prettyDate(m.updated_at)}`));mapList.append(item);});if(group.length)mapBox.fitBounds(L.featureGroup(group).getBounds().pad(.2));}
async function loadMap(){try{const me=await api('/auth/me');if(!me.user){mapPrivacy.textContent='Sign in to view authorized locations.';mapList.innerHTML='<p class="empty">Please sign in first.</p>';return;}let data;if(me.user.role==='admin')data=await api('/admin/collection-map');else{try{data=await api('/distributor/map');}catch(e){data=await api('/map/mine');showLocationShare();}}renderMap(data);}catch(e){mapPrivacy.textContent=e.message;mapList.innerHTML='<p class="empty">Unable to load location data.</p>';}}
async function showLocationShare(){const share=document.getElementById('locationShare');share.hidden=false;try{const data=await api('/submissions/mine');const select=document.getElementById('locationSubmission');select.textContent='';data.submissions.forEach(s=>{const option=document.createElement('option');option.value=s.id||'';option.textContent=`${s.tracking_id} — ${s.device_name}`;select.append(option);});if(!select.options.length)share.hidden=true;}catch(e){share.hidden=true;}}
document.getElementById('shareLocation').addEventListener('click',()=>{const message=document.getElementById('locationMessage');if(!navigator.geolocation){message.textContent='Location services are unavailable in this browser.';return;}message.textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(async position=>{try{await api('/locations/mine',{method:'POST',body:{submission_id:Number(document.getElementById('locationSubmission').value),latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy_m:position.coords.accuracy,consented:true}});message.textContent='Location submitted for verification.';}catch(e){message.textContent=e.message;}},()=>{message.textContent='Location permission was not granted; no coordinates were sent.'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000});});function refreshMapLayout(){mapBox.invalidateSize({pan:false});}window.addEventListener('load',()=>{refreshMapLayout();setTimeout(refreshMapLayout,1000);});window.addEventListener('resize',refreshMapLayout);loadMap();
</script></body></html>
